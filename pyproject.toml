[project]
name = "voice-to-clipboard"
version = "0.2.1"
description = "Local GPU dictation for Linux: hotkey or mouse button -> speech-to-text -> clipboard or typed into the focused window"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "binaryninja" }]
keywords = ["speech-to-text", "dictation", "whisper", "clipboard", "linux", "tray"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.7",
    "pynput>=1.7",
    "sounddevice>=0.4.6",
    "numpy",
    "faster-whisper>=1.1",
    "torch>=2.7",
    "torchaudio>=2.7",
    "transformers>=5.13",
]

[project.urls]
Homepage = "https://github.com/binaryninja/voice-to-clipboard"
Issues = "https://github.com/binaryninja/voice-to-clipboard/issues"

[project.scripts]
voice-to-clipboard = "voice_to_clipboard.app:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_to_clipboard"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
